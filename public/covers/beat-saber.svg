  <rect width="1600" height="900" fill="url(#bs-blue)"/>
  <g transform="translate(530.5 295.2) scale(1.2587)">
  <style>
    .bs-e { animation: bs-flicker 4.2s steps(1, end) infinite; }
    @keyframes bs-flicker {
      0%, 100% { opacity: 1; }
      31% { opacity: .18; } 32% { opacity: 1; } 34% { opacity: .3; } 36% { opacity: 1; }
      58% { opacity: .55; } 59% { opacity: 1; }
      78% { opacity: .12; } 83% { opacity: .85; } 84% { opacity: .15; } 86% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .bs-e { animation: none; } }
  </style>
  <defs>
