<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Beat Saber">
  <defs>
    <radialGradient id="bs-red" cx="50%" cy="22%" r="60%"><stop offset="0" stop-color="#7a0610" stop-opacity=".85"/><stop offset="1" stop-color="#7a0610" stop-opacity="0"/></radialGradient>
    <radialGradient id="bs-blue" cx="50%" cy="80%" r="60%"><stop offset="0" stop-color="#062a6e" stop-opacity=".8"/><stop offset="1" stop-color="#062a6e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#07070b"/>
